<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมัครงาน - PHATTHALUNG RE:START</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-emerald-600 text-white font-bold p-2 rounded-lg text-xl">PR</span>
                <span class="text-xl font-bold text-slate-900">PHATTHALUNG RE:START</span>
            </div>
            <div>
                <!-- ปุ่มกลับหน้าแรก -->
                <a href="index.html" class="text-emerald-600 font-medium hover:underline">&larr; กลับหน้าแรก</a>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <main class="flex-grow py-12">
        <div class="max-w-xl mx-auto px-4">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-md">
                <h1 class="text-2xl font-bold text-slate-900 mb-1 text-center">แบบฟอร์มลงทะเบียนเข้าร่วมโครงการ</h1>
                <p class="text-sm text-slate-600 mb-6 text-center">กรอกข้อมูลส่วนตัวเพื่อบันทึกเข้าสู่ระบบฐานข้อมูล</p>
                
                <form id="applyForm" onsubmit="submitForm(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                        <input type="text" id="name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50" placeholder="เช่น นายสมชาย ใจดี">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                        <input type="tel" id="phone" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50" placeholder="เช่น 0812345678">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">อำเภอในจังหวัดพัทลุง</label>
                        <select id="district" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            <option value="อำเภอเมืองพัทลุง">อำเภอเมืองพัทลุง</option>
                            <option value="อำเภอควนขนุน">อำเภอควนขนุน</option>
                            <option value="อำเภอเขาชัยสน">อำเภอเขาชัยสน</option>
                            <option value="อำเภอปากพะยูน">อำเภอปากพะยูน</option>
                            <option value="อำเภอป่าบอน">อำเภอป่าบอน</option>
                            <option value="อำเภอบางแก้ว">อำเภอบางแก้ว</option>
                            <option value="อำเภอป่าพะยอม">อำเภอป่าพะยอม</option>
                            <option value="อำเภอกงหรา">อำเภอกงหรา</option>
                            <option value="อำเภอศรีนครินทร์">อำเภอศรีนครินทร์</option>
                            <option value="อำเภอศรีบรรพต">อำเภอศรีบรรพต</option>
                            <option value="อำเภอตะโหมด">อำเภอตะโหมด</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ตำแหน่งงานที่สนใจ</label>
                        <select id="job" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            <option value="พนักงานดูแลสวนและเกษตรกรรม">🌱 พนักงานดูแลสวนและเกษตรกรรม</option>
                            <option value="ช่างซ่อมบำรุงและงานช่าง">🛠️ ช่างซ่อมบำรุงและงานช่าง</option>
                            <option value="พนักงานบริการและท่องเที่ยว">☕ พนักงานบริการและท่องเที่ยว</option>
                            <option value="งานหัตถกรรมพื้นบ้าน">🎨 งานหัตถกรรมพื้นบ้านพัทลุง</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition shadow-md mt-4">
                        ยืนยันการลงทะเบียน
                    </button>
                </form>

                <!-- กล่องแสดงผลเมื่อกดส่งสำเร็จ -->
                <div id="successBox" class="hidden mt-6 p-5 bg-emerald-50 border border-emerald-300 rounded-xl">
                    <h3 class="font-bold text-emerald-900 text-lg mb-2">🎉 ลงทะเบียนสำเร็จ!</h3>
                    <div id="successDetails" class="text-sm text-slate-700 space-y-1"></div>
                    <div class="mt-4">
                        <a href="index.html" class="block text-center bg-slate-800 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">กลับสู่หน้าแรก</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm">
        <p>&copy; 2026 PHATTHALUNG RE:START Project. All rights reserved.</p>
    </footer>

    <!-- JavaScript สำหรับรับข้อมูลฟอร์ม -->
    <script>
        function submitForm(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const district = document.getElementById('district').value;
            const job = document.getElementById('job').value;

            const code = 'PR-' + Math.floor(100000 + Math.random() * 900000);

            // ซ่อนฟอร์ม แล้วแสดงกล่องสรุปผล
            document.getElementById('applyForm').classList.add('hidden');
            
            const box = document.getElementById('successBox');
            const details = document.getElementById('successDetails');

            details.innerHTML = `
                <p><strong>รหัสใบสมัคร:</strong> <span class="text-emerald-700 font-bold">${code}</span></p>
                <p><strong>ชื่อ-นามสกุล:</strong> ${name}</p>
                <p><strong>เบอร์โทรศัพท์:</strong> ${phone}</p>
                <p><strong>พื้นที่:</strong> ${district}, จ.พัทลุง</p>
                <p><strong>ตำแหน่งที่สมัคร:</strong> ${job}</p>
                <p class="text-emerald-700 mt-2 font-medium">เจ้าหน้าที่ได้รับข้อมูลเรียบร้อยแล้ว จะติดต่อกลับโดยเร็วที่สุดครับ</p>
            `;

            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
