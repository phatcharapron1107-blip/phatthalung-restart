                        <option value="art">🎨 งานฝีมือ / งานจักสาน / งานศิลปหัตถกรรม</option>

    <!-- JavaScript จับคู่งานตามความถนัด -->
    <script>
        function submitForm(event) {
            event.preventDefault();

            const exCode = document.getElementById('exCode').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const district = document.getElementById('district').value;
            const skillKey = document.getElementById('skill').value;

            // ระบบแมตชิ่งตำแหน่งงานอัตโนมัติตามความถนัด
            let matchedJob = "";
            let skillName = "";

            if (skillKey === 'agri') {
                skillName = "ทำเกษตรกรรม / ปลูกพืช / เลี้ยงสัตว์";
                matchedJob = "🌱 พนักงานดูแลสวนและเกษตรกรรมชุมชน (ตรงกับความถนัด 100%)";
            } else if (skillKey === 'craft') {
                skillName = "งานช่าง / ไฟฟ้า / เชื่อมโลหะ / ก่อสร้าง";
                matchedJob = "🛠️ ช่างซ่อมบำรุงและงานโครงสร้างอาคาร (ตรงกับความถนัด 100%)";
            } else if (skillKey === 'service') {
                skillName = "บริการ / ทำอาหาร / การชงกาแฟ / ชงเครื่องดื่ม";
                matchedJob = "☕ พนักงานบริการร้านอาหาร คาเฟ่ และแหล่งท่องเที่ยว (ตรงกับความถนัด 100%)";
            } else if (skillKey === 'art') {
                skillName = "งานฝีมือ / งานจักสาน / งานศิลปหัตถกรรม";
                matchedJob = "🎨 ผู้ผลิตงานหัตถกรรมพื้นบ้านพัทลุง (ตรงกับความถนัด 100%)";
            }

            const code = 'PR-' + Math.floor(100000 + Math.random() * 900000);

            document.getElementById('applyForm').classList.add('hidden');
            
            const box = document.getElementById('successBox');
            const details = document.getElementById('successDetails');

            details.innerHTML = `
                <p><strong>รหัสอ้างอิงระบบ:</strong> <span class="text-emerald-700 font-bold">${code}</span></p>
                <p><strong>รหัสประจำตัวผู้พ้นโทษ:</strong> ${exCode}</p>
                <p><strong>ชื่อ-นามสกุล:</strong> ${name}</p>
                <p><strong>เบอร์โทรศัพท์:</strong> ${phone}</p>
                <p><strong>พื้นที่พักอาศัย:</strong> ${district}, จ.พัทลุง</p>
                <p><strong>ความถนัดที่เลือก:</strong> ${skillName}</p>
                
                <div class="mt-3 p-3 bg-white rounded-lg border border-emerald-200">
                    <p class="font-bold text-emerald-800">🎯 ตำแหน่งงานที่ระบบจับคู่ให้:</p>
                    <p class="text-emerald-600 font-semibold mt-1">${matchedJob}</p>
                </div>

                <p class="text-slate-600 text-xs mt-2">ระบบได้บันทึกข้อมูลเพื่อส่งต่อให้ผู้ประกอบการในพื้นที่เรียบร้อยแล้วครับ</p>
            `;

            box.classList.remove('hidden');
        }
    </script>
